# Stack Docker locale du projet MASSIFS — voir docker/README.md pour l'usage.
#
# Le thème (wp-content/themes/massifs) et l'extension (wp-content/plugins/massifs-core)
# sont montés depuis le dépôt : jamais copiés dans une image, toujours modifiables en direct.
# Rien de tiers n'est baké dans les images ; les identifiants viennent de .env (jamais commité).

services:
  db:
    image: mariadb:11.4
    container_name: massifs_db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-massifs}
      MARIADB_USER: ${DB_USER:-massifs}
      MARIADB_PASSWORD: ${DB_PASSWORD:-massifs}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-massifs_root}
    volumes:
      - massifs_db_data:/var/lib/mysql
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh --connect --innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - massifs

  wordpress:
    build:
      context: ./docker/wordpress
    image: massifs/wordpress:local
    container_name: massifs_wordpress
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-massifs}
      WORDPRESS_DB_USER: ${DB_USER:-massifs}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-massifs}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: 0
      # Coupe-circuit d'ingestion (voir includes/ingest/prefecture/class-settings.php
      # dans l'extension) : à `local`/`development` sans URL de bouchon redéfinie,
      # le connecteur préfecture est désarmé. Fixé ici en dur (pas dans .env) et
      # non commenté : un développeur ne doit jamais "utilement" le retirer ou le
      # basculer sur `production` sur cette stack — une rafale de requêtes réelles
      # vers le serveur de la préfecture depuis une machine de dev est le genre
      # d'incident qui fait bannir notre IP et abîme la relation avec la source.
      WP_ENVIRONMENT_TYPE: local
      # WP-Cron loopback cassé dans ce conteneur : `http://localhost:8080/wp-cron.php`
      # (l'URL de site, port hôte) n'est pas joignable depuis l'intérieur du
      # conteneur (rien n'écoute sur 8080 en interne — Apache y écoute sur 80).
      # Plutôt que de laisser WordPress tenter silencieusement et échouer à
      # chaque chargement de page, on coupe le déclenchement automatique
      # explicitement et on documente le déclenchement manuel dans
      # docker/README.md (`wp cron event run`). Voir ce fichier pour le détail.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'DISABLE_WP_CRON', true );
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    volumes:
      - massifs_wp_data:/var/www/html
      # Thème et extension : montés depuis le dépôt, jamais copiés dans l'image.
      - ./wp-content/themes/massifs:/var/www/html/wp-content/themes/massifs
      - ./wp-content/plugins/massifs-core:/var/www/html/wp-content/plugins/massifs-core
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null http://127.0.0.1/wp-login.php"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - massifs

  wpcli:
    image: wordpress:cli-php8.3
    container_name: massifs_wpcli
    # Le service wordpress (Debian) exécute www-data en UID/GID 33 ; l'image
    # wp-cli officielle (Alpine) a un www-data en UID/GID 82. Sans cette ligne,
    # wp-cli écrit/supprime des fichiers avec un UID différent du propriétaire
    # réel dans le volume partagé -> échecs silencieux de suppression de thème/
    # extension et avertissements de droits sur wp-content/uploads.
    user: "33:33"
    depends_on:
      db:
        condition: service_healthy
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-massifs}
      WORDPRESS_DB_USER: ${DB_USER:-massifs}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-massifs}
      WORDPRESS_PORT: ${WORDPRESS_PORT:-8080}
      WP_TITLE: ${WP_TITLE:-MASSIFS}
      WP_ADMIN_USER: ${WP_ADMIN_USER:-admin}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD:-admin}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL:-admin@massifs.local}
      WP_MANAGER_USER: ${WP_MANAGER_USER:-gestionnaire-demo}
      WP_MANAGER_PASSWORD: ${WP_MANAGER_PASSWORD:-gestionnaire}
      WP_MANAGER_EMAIL: ${WP_MANAGER_EMAIL:-gestionnaire@massifs.local}
      # Même coupe-circuit que le service wordpress, et pour la même raison : ce
      # conteneur est le moyen documenté de déclencher le cron à la main
      # (`wp cron event run`, cf. docker/README.md) depuis que WORDPRESS_CONFIG_EXTRA
      # désactive le déclenchement automatique. Sans ce réglage ici aussi, un
      # déclenchement manuel depuis wpcli s'exécuterait en environnement
      # `production` et pourrait armer un appel sortant réel.
      WP_ENVIRONMENT_TYPE: local
    volumes:
      - massifs_wp_data:/var/www/html
      - ./wp-content/themes/massifs:/var/www/html/wp-content/themes/massifs
      - ./wp-content/plugins/massifs-core:/var/www/html/wp-content/plugins/massifs-core
      - ./docker/provision:/provision:ro
    # Conteneur outil, pas un service persistant : `docker compose up -d` le fait
    # tourner une fois (affichage de la version) puis il s'arrête — c'est attendu.
    # Usage réel : `docker compose run --rm wpcli <commande wp>` ou le script
    # docker/up.sh qui l'utilise pour provisionner.
    command: ["cli", "version"]
    networks:
      - massifs

  tiles:
    image: nginx:1.27-alpine
    container_name: massifs_tiles
    restart: unless-stopped
    volumes:
      - ./docker/tiles/data:/usr/share/nginx/html/tiles:ro
      - ./docker/tiles/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${TILES_PORT:-8081}:80"
    healthcheck:
      # 127.0.0.1 explicite : nginx n'écoute qu'en IPv4 et "localhost" résout
      # d'abord en ::1 dans ce conteneur, ce qui ferait échouer le contrôle.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - massifs

networks:
  massifs:
    driver: bridge

volumes:
  massifs_db_data:
  massifs_wp_data:
