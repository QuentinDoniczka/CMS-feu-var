# Source de tuiles locale du projet MASSIFS (service "tiles").
#
# Sert exclusivement des fichiers déjà présents sur notre propre origine —
# jamais un appel du navigateur vers un CDN de tuiles tiers (OSM public, etc.).
# Voir docker/tiles/data/README.md pour la structure attendue et son remplissage.
server {
    listen 80;
    server_name _;

    location = /healthz {
        default_type text/plain;
        return 200 "ok";
    }

    location /tiles/ {
        alias /usr/share/nginx/html/tiles/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
