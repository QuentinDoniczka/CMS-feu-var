# Garde-fou large : aucune requête HTTP directe vers un fichier .php de thème
# ou d'extension n'est un usage légitime. WordPress charge ces fichiers en
# interne (`require`) depuis wp-blog-header.php / index.php ; jamais via une
# URL qui pointe dessus. Bloquer l'accès direct au niveau du serveur web ne
# change donc rien au fonctionnement du site : le thème `massifs` et
# l'extension `massifs-core` continuent de fonctionner à l'identique.
#
# `includes/domain/massifs/.htaccess` (livré par l'extension) protège déjà son
# propre sous-arbre (archive source de build). Ce garde-fou couvre tout le
# reste de wp-content/plugins/ et wp-content/themes/, pour tout fichier .php
# présent ou futur, sans dépendre d'un .htaccess par sous-répertoire — décision
# documentée dans docker/README.md.
<DirectoryMatch "^/var/www/html/wp-content/(plugins|themes)/">
    <FilesMatch "\.php$">
        <IfModule mod_authz_core.c>
            Require all denied
        </IfModule>
        <IfModule !mod_authz_core.c>
            Order allow,deny
            Deny from all
        </IfModule>
    </FilesMatch>
</DirectoryMatch>
