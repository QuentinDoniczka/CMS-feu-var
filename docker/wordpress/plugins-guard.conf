# Garde-fou large : aucune requête HTTP directe vers un fichier .php de thème
# ou d'extension n'est un usage légitime. WordPress charge ces fichiers en
# interne (`require`) depuis wp-blog-header.php / index.php ; jamais via une
# URL qui pointe dessus. Bloquer l'accès direct au niveau du serveur web ne
# change donc rien au fonctionnement du site : le thème `massifs` et
# l'extension `massifs-core` continuent de fonctionner à l'identique.
#
# `includes/domain/massifs/.htaccess` (livré par l'extension) protège déjà son
# propre sous-arbre (archive source de build). Ce garde-fou couvre tout le
# reste de wp-content/plugins/ et wp-content/themes/, pour tout fichier .php
# présent ou futur, sans dépendre d'un .htaccess par sous-répertoire — décision
# documentée dans docker/README.md.
<DirectoryMatch "^/var/www/html/wp-content/(plugins|themes)/">
    <FilesMatch "\.php$">
        <IfModule mod_authz_core.c>
            Require all denied
        </IfModule>
        <IfModule !mod_authz_core.c>
            Order allow,deny
            Deny from all
        </IfModule>
    </FilesMatch>
</DirectoryMatch>

# Second garde-fou : des SOUS-ARBRES entiers, pas seulement les fichiers .php.
#
# Ce qui est refusé — `includes/`, `build/`, `node_modules/`, à n'importe quelle
# profondeur sous wp-content/plugins/ ou wp-content/themes/. Ces trois noms
# désignent des répertoires structurellement non publics : code de domaine,
# outillage de build (archive source de 3 Mo, registre d'identités, artefact de
# recette), dépendances npm. Rien de ce qu'ils contiennent n'est destiné à un
# navigateur, quelle que soit l'extension du fichier.
#
# Ce que le premier bloc ne couvrait pas : tout ce qui n'est pas `.php`. Un
# `includes/ingest/prefecture/README.md`, un `.json`, un `.geojson` ou un `.md`
# de note interne partaient en 200. C'est exactement le défaut relevé sur
# l'artefact de recette de la géométrie, qui vivait dans `data/` et était donc
# servi publiquement.
#
# Ce qui est DÉLIBÉRÉMENT épargné, et doit le rester :
#   - `wp-content/themes/massifs/assets/css/` et `assets/fonts/` — CSS écrit à
#     la main et polices auto-hébergées. Le §3 du brief interdit toute requête
#     vers un domaine tiers : ces fichiers DOIVENT être servis depuis notre
#     origine, les refuser casserait la contrainte au lieu de la tenir ;
#   - `wp-content/plugins/massifs-core/data/` — sert la géométrie publiée au
#     navigateur, et servira les caches météo / EFFIS / tuiles des chaînes
#     suivantes.
#
# `assets/vendor/`, lui, n'est PAS épargné par ce bloc, et cette liste a
# longtemps prétendu le contraire. La regex ci-dessous refuse bel et bien
# `assets/vendor/**/build/`, `**/includes/` et `**/node_modules/` : un paquet
# vendorisé y tombe comme n'importe quel autre sous-arbre. NE PAS LIRE CE BLOC
# ISOLÉMENT — le `build/` d'une bibliothèque vendorisée est ré-accordé par le
# bloc de grant EN FIN DE FICHIER, qui porte la démonstration complète, tandis
# que `includes/` et `node_modules/` sous `vendor/` restent refusés. C'est
# précisément cette prose, qui affirmait le contraire de la directive qu'elle
# surplombe, qui avait rendu le défaut invisible en relecture : la corriger fait
# partie du correctif, pas de sa documentation.
#
# Pourquoi des sous-arbres et non une liste noire de noms de fichiers : une
# liste noire ne protège que ce qu'on a déjà vu. La prochaine chaîne qui dépose
# un fichier interne sous `includes/` serait exposée sans qu'aucun test ne le
# dise. Un sous-arbre refusé protège aussi ce qui n'existe pas encore.
<DirectoryMatch "^/var/www/html/wp-content/(plugins|themes)/[^/]+/(.*/)?(includes|build|node_modules)/">
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
    <IfModule !mod_authz_core.c>
        Order allow,deny
        Deny from all
    </IfModule>
</DirectoryMatch>

# Troisième garde-fou — EXCEPTION : le build d'une bibliothèque vendorisée.
#
# Le second bloc refuse `build/` à n'importe quelle profondeur sous
# `themes/<thème>/`. Un paquet vendorisé sous
# `themes/massifs/assets/vendor/<paquet>/build/` y tombe donc, alors que c'est
# exactement l'arbre que le navigateur doit pouvoir charger depuis notre
# origine. Le nom `build/` d'un arbre étranger ne dit rien de son contenu :
# c'est le répertoire de publication de certains paquets npm, pas notre
# outillage. Refuser cet arbre ne ferait sortir aucune requête de notre
# origine — cela casserait la carte, et surtout cela pousserait la chaîne qui
# vendorise à chercher une origine externe pour s'en sortir. C'est cette
# réaction-là qu'on prévient ici.
#
# ORDRE DE FUSION APACHE 2.4 — c'est ce qui rend ce bloc vivant, et c'est
# l'invariant le plus facile à détruire par « simplification ». Les
# autorisations sont fusionnées par phases : (1) `<Directory>` non-regex et
# `.htaccess`, (2) `<DirectoryMatch>` DANS L'ORDRE DU FICHIER, (3) `<Files>` et
# `<FilesMatch>`, (4) `<Location>` et `<LocationMatch>`, (5) `<If>`.
# `AuthMerging` vaut `Off` par défaut : l'autorisation d'une section REMPLACE
# celle de la précédente au lieu de s'y ajouter. D'où deux formes imposées :
#
#   - `<DirectoryMatch>` et jamais `<Directory>` : `<Directory>` est fusionné
#     en phase 1, donc AVANT le refus de la phase 2, qui l'écraserait. Le grant
#     serait livré mort tout en paraissant correct ;
#   - jamais `<LocationMatch>` non plus, malgré le précédent de
#     `tiles-proxy.conf` : la phase 4 est POSTÉRIEURE au `<FilesMatch "\.php$">`
#     du premier bloc, un grant écrit là rouvrirait tous les `.php` du thème.
#     `<Location>` reste légitime pour un mandataire, où aucune autorisation
#     n'est en jeu.
#
# ASYMÉTRIE VOULUE avec l'extension : ce grant ne nomme que `themes/massifs/`,
# et `plugins/massifs-core/assets/vendor/**/build/` reste refusé. Un asset de
# l'extension qui buterait sur ce refus se corrige en le DÉPLAÇANT dans le
# thème — l'architecture y loge la vendorisation. Élargir le grant à
# `plugins/` rouvrirait le sous-arbre dont l'issue #20 a fait un invariant
# opposable.
#
# `Options -Indexes` est écrit en forme relative : la forme absolue
# (`Options None`) remplacerait l'hérité et pourrait retirer `FollowSymLinks`.
#
# Il n'y a DÉLIBÉRÉMENT pas de branche `<IfModule !mod_authz_core.c>` ici, à la
# différence de tous les autres blocs de ce fichier. Ce n'est pas un oubli :
# c'est le seul endroit où une branche de repli pourrait OUVRIR un sous-arbre.
# Sans `mod_authz_core`, son absence laisse le refus du second bloc en place —
# on échoue fermé. Sur Apache 2.4 cette branche serait morte de toute façon.
<DirectoryMatch "^/var/www/html/wp-content/themes/massifs/assets/vendor/(.*/)?build(/|$)">
    Options -Indexes
    <IfModule mod_authz_core.c>
        Require all granted
    </IfModule>
</DirectoryMatch>

# Quatrième garde-fou — RE-REFUS. Il est porteur, jamais décoratif.
#
# Une section `<DirectoryMatch>` est éprouvée à CHAQUE pas de la marche de
# répertoires, et la regex du grant ci-dessus n'est pas ancrée à droite : elle
# matche donc aussi les descendants d'un `build/`. Sans ce bloc,
# `assets/vendor/<paquet>/build/node_modules/x` serait SERVI — le grant matche
# via `build/` et, `AuthMerging` valant `Off`, remplace le refus du second
# bloc. C'est le seul dispositif qui ferme cette ligne-là.
#
# Il doit rester APRÈS le grant. Le placer avant le rendrait inopérant : même
# phase de fusion, c'est l'ordre du fichier qui tranche.
#
# Pourquoi `node_modules` seul, sans `includes` : la présence d'un
# `node_modules/` dans un paquet vendorisé est en elle-même une erreur de
# vendorisation, jamais un asset. Refuser au contraire un `includes/` d'un
# arbre étranger sur la seule foi de son nom est exactement la classe de
# problème que le grant ci-dessus corrige.
#
# TROU CONNU ET ASSUMÉ, écrit ici plutôt que passé sous silence : le grant
# rouvre `assets/vendor/**/build/**/includes/**`. Le risque est borné à des
# fichiers NON-PHP d'une bibliothèque publique par nature, les `.php` restant
# fermés par le premier bloc (phase 3, postérieure au grant). Le refermer un
# jour serait un arbitrage neuf, pas un ajustement.
#
# Enfin, `dist/` est absent de l'alternation de refus du second bloc et doit le
# rester : `assets/vendor/<paquet>/dist/<paquet>.js` est servi aujourd'hui, et
# c'est là que la plupart des paquets npm publient leur artefact. L'ajouter
# « par symétrie » recréerait à l'instant même le défaut que le grant corrige.
<DirectoryMatch "^/var/www/html/wp-content/themes/massifs/assets/vendor/(.*/)?node_modules(/|$)">
    <IfModule mod_authz_core.c>
        Require all denied
    </IfModule>
    <IfModule !mod_authz_core.c>
        Order allow,deny
        Deny from all
    </IfModule>
</DirectoryMatch>
