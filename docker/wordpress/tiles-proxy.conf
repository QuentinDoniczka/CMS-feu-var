# Fait de /tiles/ un chemin same-origin sur le conteneur wordpress, reversé vers
# le service "tiles" (nginx interne). Ainsi, même en local, le navigateur ne
# contacte jamais un service tiers pour le fond de carte : il ne connaît que
# http://localhost:<port WORDPRESS_PORT>/tiles/...
#
# En production, la même logique s'applique via le reverse proxy de l'hébergeur
# (ou un vhost dédié) devant le cache de tuiles auto-hébergé.
<Location "/tiles/">
    ProxyPass "http://tiles/tiles/"
    ProxyPassReverse "http://tiles/tiles/"
</Location>
