# Compression HTTP pour le texte et le JSON servis par ce conteneur (contrainte
# §10 du brief : budget de poids serré sur la géométrie des massifs, et la
# tolérance de simplification ne peut se resserrer que si la compression est
# effectivement là — voir data/massifs-13.geometrie.json).
#
# gzip suffit : c'est ce que "Accept-Encoding: gzip, deflate, br" négocie dans
# tous les navigateurs et clients de test. Pas de mod_brotli ici pour rester
# strictement au nécessaire de l'image de base.
<IfModule mod_deflate.c>
    AddOutputFilterByType DEFLATE text/html text/plain text/css text/xml \
        text/javascript application/javascript application/json \
        application/xml application/rss+xml application/atom+xml \
        image/svg+xml

    # Fichiers déjà compressés : ne pas re-compresser (coût CPU inutile).
    SetEnvIfNoCase Request_URI \.(?:gif|jpe?g|png|webp|avif|zip|gz|pmtiles|mbtiles)$ no-gzip

    # Défaut Apache 2.4 : `DeflateAlterETag AddSuffix` fait porter à l'ETag
    # compressé un suffixe (`W/"<sha1>-gzip"`) sans le retirer côté requête
    # entrante. Un client qui négocie gzip (donc quasi tous) envoie l'ETag
    # d'origine dans `If-None-Match`, Apache compare avec le suffixe ajouté,
    # la comparaison échoue toujours et aucun `304` n'est jamais rendu — la
    # route REST (ETag + Last-Modified) retransfère le corps entier à chaque
    # requête au lieu de revalider. Ce que le serveur renvoie reste toujours
    # exact : c'est une perte de bande passante, jamais une panne.
    # `NoChange` laisse l'ETag intact sous compression et restaure le `304`.
    DeflateAlterETag NoChange
</IfModule>
